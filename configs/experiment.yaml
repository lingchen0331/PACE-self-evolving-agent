# Runnable single-server example. Run commands from the repository root.
# Supported tasks: mmlu | mgsm | ifeval
# These are example settings, not a complete paper reproduction manifest.
task: mmlu
runs: 1
goal_prompt_path: src/goal_prompt.md
max_outer_evolve_steps: 20
disable_tool_calls: false

model:
  base_url: http://127.0.0.1:8000/v1
  # For multiple servers, replace base_url with a base_urls list.
  # Supply credentials through OPENAI_API_KEY; local vLLM defaults to EMPTY.
  infer_model: qwen3-local
  optimizer_model: qwen3-local
  outer_loop_model: qwen3-local

inner_loop:
  iterations: 4
  train_size: 24
  valid_size: 16
  candidates_per_iter: 8
  seed: 7
  rotate_seed_each_call: true

evolution_credit:
  prompt_saturation_epsilon: 0.01
  fallback_min_prompt_update_rounds: 2
  ab_gate_delta_threshold: 0.02

token_management:
  max_input_tokens: 28672
  max_output_tokens: 2000

concurrency:
  max_workers: 16
